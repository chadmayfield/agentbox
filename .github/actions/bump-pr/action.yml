name: Open the version bump pull request
description: >
  Applies the pin changes from the bump workflow's resolve job to the checked-out
  develop commit, pushes them to a new bump/<date>-<run> branch and opens a pull
  request against develop. It refuses a patch that changes any file the resolver
  does not write. The checkout must store a token that can push.
inputs:
  token:
    description: Token for gh, with Contents and Pull requests write on the repository.
    required: true
  app-slug:
    description: Slug of the GitHub App that owns the token. Empty for GITHUB_TOKEN.
    required: false
    default: ""
  patch-file:
    description: Path of the git diff the resolver produced, from the bump-patch artifact.
    required: true
  changes-file:
    description: Path of the resolver's output, quoted in the pull request body.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APP_SLUG: ${{ inputs.app-slug }}
        PATCH_FILE: ${{ inputs.patch-file }}
        CHANGES_FILE: ${{ inputs.changes-file }}
        RUN: ${{ github.run_number }}
      run: |
        set -u
        refuse() {
          echo "::error::bump-pr: refusing the patch: $1"
          exit 1
        }
        # The patch may only modify the files scripts/bump_versions.py writes: versions.env,
        # the Kubernetes deployments it repins (K8S_IMAGES) and the extras package files.
        # It may not create, delete, rename or copy a file or change a mode.
        summary=$(git apply --summary "$PATCH_FILE")
        if [ -n "$summary" ]; then
          printf '%s\n' "$summary"
          refuse "it creates, deletes, renames or copies a file or changes a mode (listed above)"
        fi
        name='[A-Za-z0-9_][A-Za-z0-9._-]*'
        allowed="^(versions\.env|deploy/kubernetes/$name/deployment\.yaml|rootfs/usr/local/share/agentainer/extras/$name/package(-lock)?\.json)\$"
        git apply --numstat -z "$PATCH_FILE" >"$RUNNER_TEMP/numstat"
        count=0
        # -z records: added<TAB>deleted<TAB>path<NUL>. A binary file shows "-" for both counts.
        # Split on the first two tabs only, so tabs at the ends of a path stay part of it.
        while IFS= read -r -d '' rec; do
          added=${rec%%$'\t'*}
          rest=${rec#*$'\t'}
          deleted=${rest%%$'\t'*}
          path=${rest#*$'\t'}
          if ! [[ $added =~ ^([0-9]+|-)$ && $deleted =~ ^([0-9]+|-)$ ]]; then
            refuse "unexpected numstat record"
          fi
          if [ "$added" = - ] || [ "$deleted" = - ]; then
            refuse "binary change to $path"
          fi
          if ! [[ $path =~ $allowed ]]; then
            refuse "it changes $path, which the resolver never writes"
          fi
          count=$((count + 1))
        done <"$RUNNER_TEMP/numstat"
        if [ "$count" -eq 0 ]; then
          refuse "it changes no file"
        fi
        # The report script comes from the commit before the patch.
        git show HEAD:scripts/build_report.py >"$RUNNER_TEMP/build_report.py"
        git show HEAD:versions.env >"$RUNNER_TEMP/old-versions.env"
        git apply --index "$PATCH_FILE"
        python3 "$RUNNER_TEMP/build_report.py" major "$RUNNER_TEMP/old-versions.env" versions.env >"$RUNNER_TEMP/major.md"
        b="bump/$(date -u +%Y-%m-%d)-$RUN"
        if [ -n "$APP_SLUG" ]; then
          # The App's bot user, as the create-github-app-token README sets it up.
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        fi
        git switch -c "$b"
        git commit -m "chore: version bump"
        git push origin "$b"
        # A fence longer than any backtick run in the resolver output, so no line of it ends the block.
        fence='```'
        while grep -qF -- "$fence" "$CHANGES_FILE"; do fence="${fence}\`"; done
        { echo "Automated pin update. Review and merge by hand."; echo; cat "$RUNNER_TEMP/major.md"; echo "$fence"; cat "$CHANGES_FILE"; echo "$fence"; } >"$RUNNER_TEMP/body.md"
        gh pr create --base develop --head "$b" --title "Version bump $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/body.md"
        if [ -z "$APP_SLUG" ]; then
          echo "::notice::Opened with GITHUB_TOKEN: approve the CI run on the pull request with \"Approve workflows to run\"."
        fi
