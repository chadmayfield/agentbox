# Updates the SHA pins of the actions in .github/workflows and the version comment on
# the same line. Options: GitHub docs, "Dependabot options reference".
# The actionlint image digest in build.yml is a docker run argument, which Dependabot
# does not read, so it is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Dependabot waits 3 days after a release by default. 7 days gives a bad release
    # time to be found and pulled before a pull request picks it up.
    cooldown:
      default-days: 7
  # Test-only npm dependencies. Options follow the same reference linked above.
  - package-ecosystem: npm
    directory: /tests/visual
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      visual-test-dependencies:
        patterns: ["*"]
  # Extras catalog lockfiles. scripts/bump_versions.py updates them together with their
  # versions.env pins, the registry signature checks and the 7-day minimum release age,
  # so Dependabot should open no pull requests here. `open-pull-requests-limit: 0` turns
  # off version updates. Security updates read this entry only when it has no
  # `target-branch` ("Configuring Dependabot security updates"), so it has none and
  # pull requests go to the default branch. That `ignore` blocks security updates is not
  # verified in GitHub's docs. Alerts come from the dependency graph, not from this file
  # (not verified either).
  - package-ecosystem: npm
    directories:
      - /rootfs/usr/local/share/agentainer/extras/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
