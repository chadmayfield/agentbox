name: bump
on:
  schedule:
    - cron: "0 6 1,15 * *"  # 1st and 15th of each month, 06:00 UTC
  workflow_dispatch:

# Each job sets what its GITHUB_TOKEN may do. Only pr-token, the fallback without the
# App, gets write access.
permissions: {}

jobs:
  # Runs the resolver, which makes HTTP requests to upstream projects, with a read-only
  # GITHUB_TOKEN and no token stored in .git/config. The pin changes, the resolver's
  # output and its extras failures go to the later jobs in the bump-patch artifact.
  resolve:
    runs-on: ubuntu-26.04
    # Publisher verification downloads release archives for both architectures, and the
    # extras resolver runs npm and fetches registry metadata for every lockfile entry.
    # Each HTTP request times out after 60 seconds; each verifier has a 180-second limit.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      base: ${{ steps.diff.outputs.base }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Install publisher signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # The extras resolver runs npm to generate lockfiles. Node.js comes from the
      # versions.env pin, checked by build/fetch.sh, as in the image build. openssl and
      # gpg are on the runner image (actions/runner-images,
      # images/ubuntu/Ubuntu2604-Readme.md: OpenSSL, gnupg2).
      - name: Install Node.js
        run: |
          set -eu
          v=$(sed -n 's/^NODE_VERSION=//p' versions.env)
          sum=$(sed -n 's/^NODE_SHA256_AMD64=//p' versions.env)
          test -n "$v"
          test -n "$sum"
          sh build/fetch.sh "https://nodejs.org/dist/v${v}/node-v${v}-linux-x64.tar.xz" sha256 "$sum" "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          rm "$RUNNER_TEMP/node.tar.xz"
          "$RUNNER_TEMP/node/bin/node" --version
          # Later steps find this node and npm first (GitHub docs, workflow-commands,
          # "Adding a system path").
          echo "$RUNNER_TEMP/node/bin" >>"$GITHUB_PATH"
      - id: resolve
        name: Resolve pins
        shell: bash  # adds -o pipefail, so a failed resolver fails the job
        env:
          # Read-only here; the resolver uses it only to raise the GitHub API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        # Extras whose checks fail keep their pins and go to failures.txt, and the
        # resolver still exits 0, so the other pin changes get their pull request.
        run: |
          mkdir -p "$RUNNER_TEMP/bump"
          python3 scripts/bump_versions.py --failures "$RUNNER_TEMP/bump/failures.txt" | tee "$RUNNER_TEMP/bump/changes.txt"
      - id: diff
        name: Collect the changes
        shell: bash
        env:
          # A step "if" cannot read secrets (GitHub docs, use-secrets.md), so this carries
          # whether the App key is set.
          HAS_APP_KEY: ${{ secrets.BUMP_APP_PRIVATE_KEY != '' }}
          HAS_APP_ID: ${{ vars.BUMP_APP_CLIENT_ID != '' }}
        run: |
          set -u
          {
            echo "base=$(git rev-parse HEAD)"
            if [ "$HAS_APP_ID" = true ] && [ "$HAS_APP_KEY" = true ]; then echo app=true; else echo app=false; fi
            if git diff --quiet; then
              echo "No version changes found." >&2
              echo changed=false
            else
              echo changed=true
              mkdir -p "$RUNNER_TEMP/bump"
              git diff --binary >"$RUNNER_TEMP/bump/bump.patch"
            fi
          } >>"$GITHUB_OUTPUT"
      # Uploads after a failed resolver too, so extras-failures can print its lines.
      - name: Upload the pin changes
        if: always() && steps.resolve.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump/
          if-no-files-found: error
          retention-days: 1
          overwrite: true  # a re-run of the job uploads under the same name

  # A pull request opened with GITHUB_TOKEN gets its CI runs "in an approval-required
  # state" (GitHub docs, actions-do-not-trigger-workflows). A push and pull request made
  # with a GitHub App installation token start CI without that approval. The App token
  # does every write here, so GITHUB_TOKEN stays read-only.
  pr-app:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true' && needs.resolve.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The develop commit the resolver ran on, so the patch applies.
          ref: ${{ needs.resolve.outputs.base }}
          # checkout stores this token in the git config, so the git push uses it.
          token: ${{ steps.app.outputs.token }}
      # checkout cleans the workspace, so the artifact goes to the runner's temp directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump
      - uses: ./.github/actions/bump-pr
        with:
          token: ${{ steps.app.outputs.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          patch-file: ${{ runner.temp }}/bump/bump.patch
          changes-file: ${{ runner.temp }}/bump/changes.txt

  # Without the App variable and secret, GITHUB_TOKEN pushes the branch and opens the
  # pull request, so this job needs write access.
  pr-token:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true' && needs.resolve.outputs.app != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
      # checkout cleans the workspace, so the artifact goes to the runner's temp directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump
      - uses: ./.github/actions/bump-pr
        with:
          token: ${{ github.token }}
          patch-file: ${{ runner.temp }}/bump/bump.patch
          changes-file: ${{ runner.temp }}/bump/changes.txt

  # An extras check that failed keeps that extra's pin while the other pins still get
  # their pull request. This job then fails the run and prints the failed checks.
  extras-failures:
    needs: [resolve, pr-app, pr-token]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # A missing artifact leaves the file missing, which the next step reports.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: bump-patch
          path: ${{ runner.temp }}/bump
      - name: Fail on extras verification failures
        shell: bash
        env:
          FAILURES: ${{ runner.temp }}/bump/failures.txt
          RESOLVE: ${{ needs.resolve.result }}
        run: |
          set -u
          if [ -s "$FAILURES" ]; then
            echo "::error::Extras checks failed. These extras keep their current pins:"
            cat "$FAILURES"
            # A fence longer than any backtick run in the failure text, so no line of it ends the block.
            fence='```'
            while grep -qF -- "$fence" "$FAILURES"; do fence="${fence}\`"; done
            { echo "### Extras checks failed"; echo; echo "$fence"; cat "$FAILURES"; echo "$fence"; } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -f "$FAILURES" ]; then
            if [ "$RESOLVE" = success ]; then
              echo "::error::The resolve job succeeded but its failures file is missing."
              exit 1
            fi
            # The resolve job's own failure already fails the run.
            echo "No failures file; the resolve job result is $RESOLVE."
            exit 0
          fi
          echo "No extras check failed."
