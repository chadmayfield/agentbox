# Kandev: https://www.npmjs.com/package/kandev, source https://github.com/kdlbs/kandev
# The launcher runs a native runtime from the platform package @kdlbs/runtime-<os>-<arch>,
# an optional dependency (kandev bin/native-shim.js), so optional dependencies stay in.
# kandev --version runs that runtime and fails when it is missing.
package=kandev
description='Kandev web app: task board that runs coding agents and reviews their changes'
bins=kandev
omit_optional=no
check='node_modules/.bin/kandev --version'
notes='Start it with kandev --port 38429 --headless in a container started with agentainer up --publish 38429:38429, then open http://localhost:38429.'
