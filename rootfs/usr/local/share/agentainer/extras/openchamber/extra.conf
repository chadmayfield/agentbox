# OpenChamber: https://www.npmjs.com/package/@openchamber/web
# Its terminal uses node-pty, whose install script never runs; the check loads node-pty's
# prebuilt binding (node-pty prebuilds/linux-x64 and prebuilds/linux-arm64).
package=@openchamber/web
description='OpenChamber web interface for the OpenCode agent'
bins=openchamber
omit_optional=no
check='node_modules/.bin/openchamber --version && node -e "require(\"node-pty\")"'
notes='To reach it from outside the container, start it with openchamber --lan --port 3000 --ui-password <password> in a container started with agentainer up --publish 3000:3000, then open http://localhost:3000.'
