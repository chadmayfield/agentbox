# REA: https://www.npmjs.com/package/rea-agents, source https://github.com/morluto/rea
# rea-agents depends on @lydell/node-pty, whose native pty.node ships only in the optional
# platform packages @lydell/node-pty-<os>-<arch>. Its requireBinary.js loads that package
# when node-pty is required and throws when it is missing
# (https://unpkg.com/@lydell/node-pty@1.1.0/requireBinary.js), so optional dependencies stay in.
# The other optional packages are frida and its prebuild-install helpers. frida's install
# script would fetch a prebuilt binding or build one with make
# (https://unpkg.com/frida@17.23.2/scripts/install.js); npm ci --ignore-scripts never runs it,
# so frida installs without its binding. REA imports frida only when a Frida tool runs
# (await import("frida") in https://unpkg.com/rea-agents@6.8.0/dist/frida/FridaInstrumentationManager.js),
# and frida then loads frida_binding through bindings
# (https://unpkg.com/frida@17.23.2/build/src/frida.js), so those tools fail at run time.
# The rest of REA does not load frida. The check loads @lydell/node-pty.
package=rea-agents
description='REA reverse engineering CLI and MCP server'
bins='rea rea-agents'
omit_optional=no
check='node_modules/.bin/rea --version && node -e "require(\"@lydell/node-pty\")"'
notes='Install does not configure agents. Run rea-agents setup --client <agent> (for example claude_code, codex, opencode or antigravity) to add REA to an agent. The REA Frida tools do not work in this install, because the frida native binding is not built.'
